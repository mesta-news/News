name: Daily digest

on:
  schedule:
    - cron: "17 5 * * *"   # every day 05:17 UTC (07:17 Amsterdam summer time, 06:17 winter)
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["config.yaml", "news_digest/**", ".github/workflows/**"]

permissions:
  contents: write   # commit data/ and state/ back to the repo
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Claude Code (for summaries on your Claude subscription)
        run: npm install -g @anthropic-ai/claude-code

      - name: Build digest
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DIGEST_PROFILE: ${{ secrets.DIGEST_PROFILE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          # App notifications: the signing key (secret) and one code per phone (variable).
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ vars.PUSH_SUBSCRIPTIONS }}
          DIGEST_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then FLAGS="--email --push"; fi
          # A manual run ("Run workflow") also notifies, so you can test notifications.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FLAGS="--push"; fi
          python -m news_digest $FLAGS

      - name: Save history
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "Digest $(date -u +%F)"
          # Someone (or another run) may have pushed while this run was building.
          # On a clash in data/ or state/, keep this run's newer files.
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
