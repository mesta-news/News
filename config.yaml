# ---------------------------------------------------------------------------
# Notifications ("only when something big happens")
#   Price tiles alert on a one-day move of: 2% for indices, 4% for commodities,
#   1.2% for currencies, 15% for the VIX and 5% for stocks. Override per tile
#   with `alert: <percent>`. Rate tiles alert when `alert_bp:` is set and the
#   rate moved at least that many basis points since the last edition.
#   Claude also flags a tab as important on big news (see summarize.py).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Key interest rates
#   source: ecb   -> ECB Data Portal, id = "FLOW/KEY" (find series at
#                    https://data.ecb.europa.eu, copy the series key)
#   source: yahoo -> Yahoo Finance yield ticker (^TNX = US 10-year, etc.)
# ---------------------------------------------------------------------------
rates:
  - { source: ecb,   id: "FM/D.U2.EUR.4F.KR.DFR.LEV",             name: "ECB deposit rate", region: "Eurozone · policy", alert_bp: 1 }
