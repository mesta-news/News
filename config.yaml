# ---------------------------------------------------------------------------
# Personal news digest configuration
# Edit this file to change what the digest tracks. No code changes needed.
# ---------------------------------------------------------------------------

# Who the digest is for. Sent ONLY to Claude, never shown on the page.
# The detailed version lives in the GitHub secret DIGEST_PROFILE (this repo is
# public), which takes precedence. This general version is the fallback.
profile: |
  A couple living in Utrecht, the Netherlands, who read this brief separately.
  - She is a foreign-trained medical doctor looking for non-clinical roles in
    clinical research and life sciences in the Netherlands (CRA, clinical
    operations, medical affairs, medical information, pharmacovigilance). She
    is not pursuing BIG registration for now. Her tabs: Careers, Clinical
    research, Medicine.
  - He is a financial risk manager specialised in asset-liability management
    (ALM) at a Dutch retail bank (mortgages and savings), and builds software
    with AI. His tabs: Banking, Rates, Markets, Business, AI.
  - No stock holdings yet; they follow a watchlist and think in euros.

# Claude model used for the summaries (only if ANTHROPIC_API_KEY is set).
model: claude-opus-5-5
effort: medium        # low | medium | high  (higher = deeper, slower, pricier)
language: English     # language of the AI summaries (articles may be Dutch)

# Articles shown in an earlier digest are folded under "Earlier, already shown"
# so each digest leads with what is new. Remembered for this many days.
seen_retention_days: 60

# ---------------------------------------------------------------------------
# Sections
#   feeds:        RSS/Atom URLs
#   google_news:  search queries turned into Google News RSS feeds
#                 (supports OR, "exact phrases", site:example.com, -exclude)
#   keywords:     optional filter; an item must mention at least one
#   watch_pages:  official web pages checked for changes on every run. If the
#                 text of the page changes, the digest shows what changed.
#   max_age_days: ignore items older than this
#   max_items:    max articles listed in the section
# ---------------------------------------------------------------------------
sections:
  - id: careers
    title: "Careers, jobs & registration"
    short: "Careers"
    max_age_days: 7
    max_items: 15
    google_news:
      # Hiring, expansions and layoffs at CROs, pharma and biotech in the Netherlands
      - { q: 'Netherlands CRO OR pharma OR biotech hiring OR jobs OR expansion OR layoffs', lang: en }
      - { q: 'IQVIA OR ICON OR Parexel OR Syneos OR Labcorp OR "Thermo Fisher PPD" OR Fortrea Netherlands', lang: en }
      - { q: '"Julius Clinical" OR Genmab OR Merus OR "Utrecht Science Park"', lang: nl }
      - { q: '"Leiden Bio Science Park" OR Janssen Leiden OR Astellas OR MSD Haarlem OR Organon', lang: nl }
      - { q: 'farmaceutische industrie OR biotech vacatures OR banen OR ontslagen OR groei', lang: nl }
      # Roles she is targeting
      - { q: '"clinical research associate" OR "medical affairs" OR "medical science liaison" OR pharmacovigilance careers', lang: en }
      - { q: 'Holland Bio OR "Health~Holland" OR "life sciences" Nederland arbeidsmarkt', lang: nl }
      # BIG register & diploma recognition (kept in case she reconsiders):
      # only articles that mention one of the keywords, from the last 3 weeks.
      - { q: '"BIG-register" OR "BIG-registratie" buitenlands OR buitenlandse', lang: nl, max_age_days: 21, keywords: [big-regist, big regist, big-registratie, buitenland, foreign, diploma, akv, bi-toets, cbgv, erkenning, recogni, internationa, migrant, taaltoets] }
      - { q: '"buitenlandse artsen" OR "buitenlands gediplomeerde" OR "buitenlands diploma" zorg', lang: nl, max_age_days: 21, keywords: [big-regist, big regist, big-registratie, buitenland, foreign, diploma, akv, bi-toets, cbgv, erkenning, recogni, internationa, migrant, taaltoets] }
      - { q: 'AKV-toets OR BI-toets OR CBGV OR "Commissie Buitenlandse Gediplomeerden"', lang: nl, max_age_days: 21, keywords: [big-regist, big regist, big-registratie, buitenland, foreign, diploma, akv, bi-toets, cbgv, erkenning, recogni, internationa, migrant, taaltoets] }
      - { q: 'Netherlands foreign doctors "BIG register" OR registration OR diploma', lang: en, max_age_days: 21, keywords: [big-regist, big regist, big-registratie, buitenland, foreign, diploma, akv, bi-toets, cbgv, erkenning, recogni, internationa, migrant, taaltoets] }
    watch_pages:
      - { name: "BIG-register (home)", url: "https://www.bigregister.nl/" }
      - { name: "BIG-register - English", url: "https://english.bigregister.nl/" }

  - id: research
    title: "Clinical trials, regulation & medical affairs"
    short: "Clinical research"
    max_age_days: 7
    max_items: 15
    google_news:
      - { q: 'EMA "European Medicines Agency" OR CHMP OR PRAC', lang: en }
      - { q: '"ICH E6(R3)" OR "good clinical practice" OR "EU Clinical Trials Regulation" OR CTIS', lang: en }
      - { q: 'CCMO OR "CBG-MEB" OR "College ter Beoordeling van Geneesmiddelen" OR METC klinisch onderzoek', lang: nl }
      - { q: 'clinical trials Europe decentralised OR "real-world evidence" OR "AI in clinical trials"', lang: en }
      - { q: 'pharmacovigilance OR "drug safety" OR "medical affairs" industry trends', lang: en }
      - { q: 'klinisch onderzoek Nederland geneesmiddelen studie', lang: nl }

  - id: medicine
    title: "Medical science & research"
    short: "Medicine"
    max_age_days: 7
    max_items: 15
    feeds:
      - { name: "NEJM", url: "https://www.nejm.org/action/showFeed?type=etoc&feed=rss&jc=nejm" }
      - { name: "The Lancet", url: "https://www.thelancet.com/rssfeed/lancet_current.xml" }
      - { name: "The BMJ", url: "https://www.bmj.com/rss/recent.xml" }
      - { name: "Nature Medicine", url: "https://www.nature.com/nm.rss" }
      - { name: "STAT", url: "https://www.statnews.com/feed/" }
    google_news:
      - { q: '"phase 3" trial results OR "topline results" OR "met its primary endpoint"', lang: en }
      - { q: 'FDA approves OR "EMA recommends" OR "CHMP positive opinion" new drug', lang: en }
      - { q: 'NEJM OR Lancet OR JAMA OR BMJ study finds', lang: en }
      - { q: 'medisch onderzoek UMC Utrecht OR Amsterdam UMC OR LUMC OR Erasmus MC studie', lang: nl }

  - id: banking
    title: "Dutch banking & ALM"
    short: "Banking"
    max_age_days: 5
    max_items: 15
    feeds:
      - { name: "ECB Banking Supervision", url: "https://www.bankingsupervision.europa.eu/rss/press.html" }
    google_news:
      # Dutch banks and the savings/mortgage market
      - { q: 'ING OR "ABN AMRO" OR Rabobank OR "de Volksbank" OR Triodos OR "Van Lanschot" bank', lang: nl }
      - { q: '"Brand New Day" bank OR hypotheek OR pensioen', lang: nl }
      - { q: 'spaarrente OR hypotheekrente verhoogt OR verlaagt bank', lang: nl }
      - { q: 'Dutch banks net interest income OR mortgages OR deposits OR results', lang: en }
      # Supervision and regulation
      - { q: 'DNB toezicht banken OR "De Nederlandsche Bank" OR "financiële stabiliteit"', lang: nl }
      - { q: 'IRRBB OR "interest rate risk in the banking book" OR "net interest income" EBA OR ECB', lang: en }
      - { q: 'EBA OR "ECB supervision" OR "Basel III" OR CRR3 banks liquidity OR capital', lang: en }
      # Curve, pension reform, housing
      - { q: 'Wtp pensioenfondsen transitie swaprente OR rentecurve OR "lange rente"', lang: nl }
      - { q: 'euro swap rates OR "swap curve" OR Euribor OR €STR pension funds', lang: en }
      - { q: 'huizenprijzen OR woningmarkt OR hypotheekmarkt Kadaster OR CBS OR NHG', lang: nl }
      - { q: 'oversluiten OR boeterente OR "vervroegd aflossen" hypotheek', lang: nl }
      - { q: 'covered bond OR RMBS OR "senior preferred" Dutch bank issuance', lang: en }
      - { q: 'EBA "stress test" OR "deposit outflows" OR "deposit beta" banks Europe', lang: en }

    # Tiles: Dutch retail rates from the ECB's bank interest rate statistics (monthly)
    rates:
      - { source: ecb, id: "MIR/M.NL.B.A2C.A.R.A.2250.EUR.N", name: "NL new mortgages", region: "Avg rate, new business · monthly" }
      - { source: ecb, id: "MIR/M.NL.B.L22.F.R.A.2250.EUR.N", name: "NL term deposits ≤1y", region: "Households, new business · monthly" }
      - { source: ecb, id: "ICP/M.NL.N.000000.4.ANR",         name: "Dutch inflation",  region: "HICP, % y/y · monthly" }

  - id: rates
    title: "Interest rates & central banks"
    short: "Rates"
    max_age_days: 4
    max_items: 15
    feeds:
      - { name: "ECB press releases", url: "https://www.ecb.europa.eu/rss/press.html" }
      - { name: "Federal Reserve", url: "https://www.federalreserve.gov/feeds/press_all.xml" }
      - { name: "Bank of England", url: "https://www.bankofengland.co.uk/rss/news" }
    google_news:
      - { q: 'ECB interest rates OR "rate decision" OR Lagarde', lang: en }
      - { q: '"Federal Reserve" OR Fed rate cut OR "rate hike" OR Powell', lang: en }
      - { q: '"Bank of England" OR "Bank of Japan" OR "People''s Bank of China" OR SNB interest rate', lang: en }
      - { q: 'bond yields Treasury OR Bund OR "rate expectations"', lang: en }
      - { q: 'rente ECB OR hypotheekrente OR spaarrente', lang: nl }
    # Data for the rate tiles comes from the `rates:` list below.

  - id: watchlist
    title: "Markets & watchlist"
    short: "Markets"
    max_age_days: 4
    max_items: 20
    # Feeds for this section are generated from the watchlist below
    # (each entry's `news` query + Yahoo Finance headlines).

  - id: business
    title: "Business & markets"
    short: "Business"
    max_age_days: 2
    max_items: 20
    feeds:
      - { name: "Google News - Business", url: "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-US&gl=US&ceid=US:en" }
      - { name: "CNBC Top News", url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114" }
      - { name: "BBC Business", url: "https://feeds.bbci.co.uk/news/business/rss.xml" }
      - { name: "MarketWatch", url: "https://feeds.content.dowjones.io/public/rss/mw_topstories" }
      - { name: "NOS Economie", url: "https://feeds.nos.nl/nosnieuwseconomie" }
    google_news:
      - { q: 'site:reuters.com markets OR economy OR business', lang: en }
      - { q: 'site:bloomberg.com markets OR economy', lang: en }
      - { q: 'ECB OR "Federal Reserve" rates inflation', lang: en }

  - id: ai
    title: "AI - models, tools & techniques"
    short: "AI"
    max_age_days: 3
    max_items: 20
    feeds:
      - { name: "OpenAI", url: "https://openai.com/news/rss.xml" }
      - { name: "Google DeepMind", url: "https://deepmind.google/blog/rss.xml" }
      - { name: "Google AI blog", url: "https://blog.google/technology/ai/rss/" }
      - { name: "Hugging Face", url: "https://huggingface.co/blog/feed.xml" }
      - { name: "Simon Willison", url: "https://simonwillison.net/atom/everything/" }
      - { name: "Latent Space", url: "https://www.latent.space/feed" }
      - { name: "Hacker News (AI, 150+ pts)", url: "https://hnrss.org/newest?q=LLM+OR+Claude+OR+Anthropic+OR+OpenAI+OR+GPT+OR+Gemini+OR+agent&points=150" }
    google_news:
      - { q: 'Anthropic Claude', lang: en }
      - { q: 'OpenAI OR ChatGPT new model OR launch', lang: en }
      - { q: 'Google Gemini OR "DeepMind" model launch', lang: en }
      - { q: '"AI agents" OR "coding agent" OR "open-weight model" release', lang: en }

# ---------------------------------------------------------------------------
# Key interest rates
#   source: ecb   -> ECB Data Portal, id = "FLOW/KEY" (find series at
#                    https://data.ecb.europa.eu, copy the series key)
#   source: yahoo -> Yahoo Finance yield ticker (^TNX = US 10-year, etc.)
# ---------------------------------------------------------------------------
rates:
  - { source: ecb,   id: "FM/D.U2.EUR.4F.KR.DFR.LEV",             name: "ECB deposit rate", region: "Eurozone · policy" }
  - { source: ecb,   id: "EST/B.EU000A2X2A25.WT",                  name: "€STR",             region: "Eurozone · overnight" }
  - { source: ecb,   id: "FM/M.U2.EUR.RT.MM.EURIBOR3MD_.HSTA",     name: "3M Euribor",       region: "Eurozone · monthly avg" }
  - { source: ecb,   id: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y",     name: "2Y euro curve",    region: "AAA govt spot rate" }
  - { source: ecb,   id: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y",    name: "10Y euro curve",   region: "AAA govt spot rate" }
  - { source: ecb,   id: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_30Y",    name: "30Y euro curve",   region: "AAA govt spot rate" }
  - { source: ecb,   spread: ["YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y", "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y"], name: "Euro 2s10s slope", region: "10Y minus 2Y, AAA curve" }
  - { source: ecb,   spread: ["YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_30Y", "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y"], name: "Euro 10s30s slope", region: "30Y minus 10Y, AAA curve" }
  - { source: ecb,   id: "ICP/M.U2.N.000000.4.ANR",                name: "Euro area inflation", region: "HICP, % y/y" }
  - { source: ecb,   id: "IRS/M.NL.L.L40.CI.0000.EUR.N.Z",         name: "10Y Dutch DSL",    region: "Netherlands · monthly" }
  - { source: yahoo, id: "^IRX",                                   name: "US 3-month bill",  region: "United States" }
  - { source: yahoo, id: "^TNX",                                   name: "US 10-year",       region: "United States" }
  - { source: yahoo, id: "^TYX",                                   name: "US 30-year",       region: "United States" }

# ---------------------------------------------------------------------------
# Watchlist - quotes come from Yahoo Finance symbols.
#   Find a symbol at https://finance.yahoo.com (e.g. Amsterdam stocks end in .AS)
#   news: Google News query for company headlines (optional)
# ---------------------------------------------------------------------------
watchlist:
  - { symbol: "^GSPC",   name: "S&P 500" }
  - { symbol: "^NDX",    name: "Nasdaq 100" }
  - { symbol: "^AEX",    name: "AEX (Amsterdam)" }
  - { symbol: "^STOXX50E", name: "Euro Stoxx 50" }
  - { symbol: "^SX7E",   name: "Euro Stoxx Banks" }
  - { symbol: "^VIX",    name: "VIX" }
  - { symbol: "BZ=F",    name: "Brent (USD)" }
  - { symbol: "GC=F",    name: "Gold (USD)" }
  - { symbol: "EURUSD=X", name: "EUR/USD" }
  - { symbol: "WKL.AS",  name: "Wolters Kluwer", news: '"Wolters Kluwer"' }
  - { symbol: "INGA.AS",  name: "ING",            news: 'ING Groep results OR shares' }
  - { symbol: "ABN.AS",   name: "ABN AMRO",       news: '"ABN AMRO" results OR shares' }
  - { symbol: "ASML.AS", name: "ASML",           news: 'ASML' }
  - { symbol: "NVDA",    name: "Nvidia",         news: 'Nvidia stock OR earnings' }
  - { symbol: "MSFT",    name: "Microsoft",      news: 'Microsoft stock OR earnings OR AI' }
  - { symbol: "GOOGL",   name: "Alphabet",       news: 'Alphabet stock OR earnings' }
  - { symbol: "AMZN",    name: "Amazon",         news: 'Amazon stock OR earnings OR AWS' }
  - { symbol: "META",    name: "Meta",           news: 'Meta Platforms stock OR earnings' }
  - { symbol: "TSM",     name: "TSMC",           news: 'TSMC earnings OR revenue' }
